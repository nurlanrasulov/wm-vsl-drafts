name: Send VSL report drafts

on:
  schedule:
    # Monday 10:00 AM Baku (UTC+4) = 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  send-drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send VSL drafts
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          ON_BEHALF_NAME: ${{ secrets.ON_BEHALF_NAME }}
          ON_BEHALF_EMAIL: ${{ secrets.ON_BEHALF_EMAIL }}
          DRAFT_SUBJECT_CONTAINS: VSL REPORT
        run: python send_all_drafts.py
