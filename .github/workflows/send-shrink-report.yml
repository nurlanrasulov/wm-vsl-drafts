name: Send shrink performance report

on:
  schedule:
    # Monday 10:30 AM Baku (UTC+4) = 06:30 UTC
    - cron: "30 6 * * 1"
  workflow_dispatch:

jobs:
  send-shrink-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send shrink report to category team
        env:
          SHRINK_DATA_SOURCE: snowflake
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_METRICS_TABLE: ${{ secrets.SNOWFLAKE_METRICS_TABLE }}
          SNOWFLAKE_ITEMS_TABLE: ${{ secrets.SNOWFLAKE_ITEMS_TABLE }}
          SHRINK_REPORT_RECIPIENT: ${{ secrets.SHRINK_REPORT_RECIPIENT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USE_TLS: "true"
          ON_BEHALF_NAME: ${{ secrets.ON_BEHALF_NAME }}
          ON_BEHALF_EMAIL: ${{ secrets.ON_BEHALF_EMAIL }}
        run: python send_shrink_report.py
